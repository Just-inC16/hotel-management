version: "3.8"

services:
  # -----------------------
  # Eureka Server
  # -----------------------
  eureka-server:
    build: ./eurekaServer
    ports:
      - "8761:8761"

  # -----------------------
  # MySQL Database
  # -----------------------
  mysql-db:
    image: mysql:8
    environment:
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3307:3306"
    volumes:
      - ./mysql-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 10

  # -----------------------
  # API Gateway
  # -----------------------
  apiGateway:
    build: ./apiGateway
    depends_on:
      - eureka-server
    environment:
      SPRING_PROFILES_ACTIVE: dev
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka/
    ports:
      - "8085:8085"

  # -----------------------
  # Customer Service
  # -----------------------
  customer:
    build: ./customer
    depends_on:
      eureka-server:
        condition: service_started
      mysql-db:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: dev
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka/
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql-db:3306/customer
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: root
      GATEWAY_URL: http://apiGateway:8085
    ports:
      - "8080:8080"

  # -----------------------
  # Reservation Service
  # -----------------------
  reservation:
    build: ./reservation
    depends_on:
      eureka-server:
        condition: service_started
      mysql-db:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: dev
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka/
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql-db:3306/reservation
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: root
      GATEWAY_URL: http://apiGateway:8085
    ports:
      - "8081:8081"

  # -----------------------
  # Hotel Management Service
  # -----------------------
  hotelManagement:
    build: ./hotelManagement
    depends_on:
      eureka-server:
        condition: service_started
      mysql-db:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: dev
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka/
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql-db:3306/hotelmanagement
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: root
    ports:
      - "8082:8082"

  # -----------------------
  # Payment Service
  # -----------------------
  payment:
    build: ./payment
    depends_on:
      eureka-server:
        condition: service_started
      mysql-db:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: dev
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka/
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql-db:3306/payment
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: root
    ports:
      - "8083:8083"

  # -----------------------
  # Notification Service
  # -----------------------
  notification:
    build: ./notification
    depends_on:
      eureka-server:
        condition: service_started
      mysql-db:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: dev
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka/
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql-db:3306/notification
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: root
    ports:
      - "8084:8084"
