<div class="app-shell">
  <header class="top-nav">
    <a routerLink="/dashboard" class="brand">{{ title }}</a>

    <nav class="nav-links">
      <a routerLink="/dashboard" routerLinkActive="active">Dashboard</a>
      @if (isLoggedIn()) {
        <a routerLink="/bookings" routerLinkActive="active">Bookings</a>
        <a routerLink="/recommendations" routerLinkActive="active">For You</a>
      }
    </nav>

    <div class="nav-actions">
      @if (currentUser(); as user) {
        <button
          type="button"
          class="user-icon-button"
          routerLink="/profile"
          routerLinkActive="active"
          [attr.aria-label]="'Profile for ' + user.firstName"
          title="Profile"
        >
          <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true">
            <path
              fill="currentColor"
              d="M12 12a5 5 0 1 0-5-5 5 5 0 0 0 5 5Zm0 2c-4.42 0-8 2.24-8 5v1a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-1c0-2.76-3.58-5-8-5Z"
            />
          </svg>
        </button>
        <button type="button" class="logout-button" (click)="logout()">Log out</button>
      } @else {
        <a routerLink="/login" class="login-link">Log in</a>
      }
    </div>
  </header>

  <main class="app-content">
    <router-outlet />
  </main>
</div>
