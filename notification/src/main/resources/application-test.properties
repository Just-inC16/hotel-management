spring.datasource.url=jdbc:h2:mem:testdb
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# Pre-existing @KafkaListener methods require a group.id at context startup even when
# no broker is configured; disable auto-startup so tests don't need a live Kafka broker.
spring.kafka.consumer.group-id=notification-test-group
spring.kafka.listener.auto-startup=false

# Tests must not try to reach a live Eureka server; registration/registry-fetch attempts
# against an unreachable localhost:8761 can otherwise crash context startup.
eureka.client.enabled=false