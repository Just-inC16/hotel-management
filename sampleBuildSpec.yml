version: 0.2

env:
  variables:
    AWS_DEFAULT_REGION: us-east-1
    AWS_ACCOUNT_ID: 123456789012
    IMAGE_REPO_NAME: my-java-app
    IMAGE_TAG: latest

phases:
  install:
    runtime-versions:
      java: corretto11
      docker: 20
      
  pre_build:
    commands:
      - echo Logging in to Amazon ECR...
      - aws ecr get-login-password --region $AWS_DEFAULT_REGION | docker login --username AWS --password-stdin $AWS_ACCOUNT_ID.dkr.ecr.$AWS_DEFAULT_REGION.amazonaws.com
      - REPOSITORY_URI=$AWS_ACCOUNT_ID.dkr.ecr.$AWS_DEFAULT_REGION.amazonaws.com/$IMAGE_REPO_NAME
      - COMMIT_HASH=$(echo $CODEBUILD_RESOLVED_SOURCE_VERSION | cut -c 1-7)
      - IMAGE_TAG=${COMMIT_HASH:=latest}
      
  build:
    commands:
      - echo Build started on `date`
      - echo Building the Java application...
      - mvn clean package -DskipTests
      
      # Create container image using docker commands (no Dockerfile needed)
      - echo Building the Docker image...
      - |
        docker run --rm -v $(pwd):/workspace -w /workspace \
        amazoncorretto:11 /bin/bash -c "
        echo 'FROM amazoncorretto:11
        WORKDIR /app
        COPY target/*.jar app.jar
        EXPOSE 8080
        ENTRYPOINT [\"java\", \"-jar\", \"app.jar\"]' > Dockerfile.tmp
        "
      - docker build -f Dockerfile.tmp -t $REPOSITORY_URI:latest .
      - docker tag $REPOSITORY_URI:latest $REPOSITORY_URI:$IMAGE_TAG
      
  post_build:
    commands:
      - echo Build completed on `date`
      - echo Pushing the Docker images...
      - docker push $REPOSITORY_URI:latest
      - docker push $REPOSITORY_URI:$IMAGE_TAG
      - echo Writing image definitions file...
      - printf '[{"name":"my-java-app","imageUri":"%s"}]' $REPOSITORY_URI:$IMAGE_TAG > imagedefinitions.json

artifacts:
  files:
    - imagedefinitions.json
